name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject API keys into local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          UPROT_MSFI_API_BASE: ${{ secrets.UPROT_MSFI_API_BASE }}
          UPROT_MSE_API_BASE: ${{ secrets.UPROT_MSE_API_BASE }}
          UPROT_API_KEY: ${{ secrets.UPROT_API_KEY }}
        run: |
          echo TMDB_API_KEY=$TMDB_API_KEY >> local.properties
          echo RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API >> local.properties
          echo GOOGLE_DRIVE_API_KEY=$GOOGLE_DRIVE_API_KEY >> local.properties
          echo UPROT_MSFI_API_BASE=$UPROT_MSFI_API_BASE >> local.properties
          echo UPROT_MSE_API_BASE=$UPROT_MSE_API_BASE >> local.properties
          echo UPROT_API_KEY=$UPROT_API_KEY >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # --- Universal APK (default APP_LAYOUT) ---
      - name: Build Universal APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Universal APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v2
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Stage Universal APK
        run: |
          mkdir -p dist
          cp "${{ steps.sign_apk.outputs.signedReleaseFile }}" dist/streamflix-${{ github.ref_name }}.apk

      # --- Mobile-only APK ---
      - name: Set Mobile version
        run: echo APP_LAYOUT=mobile >> local.properties

      - name: Build Mobile APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Mobile APK
        id: sign_apk_mobile
        uses: r0adkll/sign-android-release@v2
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Stage Mobile APK
        run: cp "${{ steps.sign_apk_mobile.outputs.signedReleaseFile }}" dist/streamflix-${{ github.ref_name }}-only-mobile.apk

      # --- TV-only APK ---
      - name: Set TV version
        run: echo APP_LAYOUT=tv >> local.properties

      - name: Build TV APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign TV APK
        id: sign_apk_tv
        uses: r0adkll/sign-android-release@v2
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Stage TV APK
        run: cp "${{ steps.sign_apk_tv.outputs.signedReleaseFile }}" dist/streamflix-${{ github.ref_name }}-only-tv.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.apk
          generate_release_notes: true
