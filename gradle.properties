# ==============================================================================
# OPTIMIZACIÓN DE GRADLE PARA LAPTOP (6-8 GB RAM / 4 CORES)
# ==============================================================================

# 1. Asignación de memoria JVM óptima
# 2560m con ParallelGC ofrece el mejor rendimiento para R8 sin saturar RAM ni caer en SWAP
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. Control de concurrencia y trabajadores
org.gradle.workers.max=2
org.gradle.parallel=true

# 3. Cachés y persistencia del Gradle Daemon
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# 4. Optimizaciones AndroidX y deshabilitación de Jetifier
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 5. Compilación incremental de Kotlin y KSP
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.compiler.suppressWarnings=true
ksp.incremental=true
ksp.incremental.intermodule=true