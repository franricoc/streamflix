# ==============================================================================
# OPTIMIZACIÓN DE GRADLE PARA EQUIPOS DE BAJOS RECURSOS (6-8 GB RAM / 4 CORES)
# ==============================================================================

# 1. Asignación de memoria JVM realista (evita saturar la RAM y caer en SWAP de disco)
# Para equipos de 6-8 GB, 2048m a 2560m es el punto óptimo.
# Usamos ParallelGC que consume mucho menos CPU y memoria interna que G1GC en heaps pequeños.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 2. Control de concurrencia y trabajadores
# En 4 núcleos, limitar a 2 workers evita picos de memoria y congelamiento del CPU
org.gradle.workers.max=2
org.gradle.parallel=true

# 3. Cachés y persistencia del Gradle Daemon
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# 4. Optimizaciones AndroidX y deshabilitación de Jetifier (ahorra escaneos innecesarios)
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 5. Compilación incremental de Kotlin y KSP
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseParallelGC
kotlin.compiler.suppressWarnings=true
ksp.incremental=true