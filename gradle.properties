# ==============================================================================
# OPTIMIZACIÓN DE GRADLE PARA LAPTOP (6-8 GB RAM / 4 CORES)
# ==============================================================================

# 1. Asignación de memoria JVM óptima con G1GC (evita pausas Stop-The-World y thrashing de GC)
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# 2. Control de concurrencia y trabajadores (utilizar los 4 núcleos)
org.gradle.workers.max=4
org.gradle.parallel=true

# 3. Cachés y persistencia del Gradle Daemon
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# 4. Optimizaciones AndroidX y deshabilitación de Jetifier
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 5. Compilación incremental de Kotlin y KSP out-of-process (sin esperas ni timeouts de sockets)
kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=out-of-process
kotlin.compiler.suppressWarnings=true
ksp.incremental=true
ksp.incremental.intermodule=true